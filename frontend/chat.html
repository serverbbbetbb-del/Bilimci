<!DOCTYPE html><html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kömekçi | Türkmen AI</title>
    <link rel="stylesheet" href="css/chat.css">
</head><body><header class="topbar">
    <div class="logo">🇹🇲 Türkmen AI</div>

    <div class="profile">
        <span id="studentName">Okuwçy</span>
    </div>
</header>

<main class="chat-container">

    <section class="welcome">
        <div class="ai-icon">🤖</div>

        <h1>Salam! 👋</h1>

        <p>
            Men seniň türkmençe AI okuw kömekçiň.
            Islendik soragyňy berip bilersiň.
        </p>
    </section>

    <section id="messages" class="messages">

        <div class="message ai-message">
            <strong>Türkmen AI</strong>
            <p>
                Sapak, öý işi, suratdaky mesele ýa-da başga bir
                bilim soragy barada sorap bilersiň.
            </p>
        </div>

    </section>

    <section class="input-area">

        <div class="tools">
            <button type="button" id="imageButton" title="Surat iber">
                📷
            </button>

            <button type="button" id="fileButton" title="Faýl iber">
                📎
            </button>

            <button type="button" id="voiceButton" title="Ses bilen sorag ber">
                🎤
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <input
                type="file"
                id="fileInput"
                accept=".pdf,.doc,.docx,.txt"
                hidden
            >
        </div>

        <textarea
            id="messageInput"
            placeholder="Soragyňy ýaz..."
            rows="1"
        ></textarea>

        <button
            type="button"
            id="sendButton"
            class="send-button"
        >
            ➤
        </button>

    </section>

    <p class="notice">
        AI jogaplary käwagt ýalňyş bolup biler. Möhüm maglumatlary barla.
    </p>

</main>

<script src="js/chat.js"></script>
<script src="js/voice.js"></script>
<script src="js/upload.js"></script>

</body>
</html>
